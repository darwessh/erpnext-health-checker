<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERPNext Health Checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>ERPNext Health Checker</h1>
      <p class="subtitle">Run an audit and download a PDF health report.</p>

      <form id="audit-form">
        <label for="base-url">Base URL</label>
        <input id="base-url" name="base_url" type="url" placeholder="https://your-erpnext.example.com" autocomplete="url" required />

        <label for="api-key">API Key</label>
        <input id="api-key" name="api_key" type="text" autocomplete="username" required />

        <label for="api-secret">API Secret</label>
        <input id="api-secret" name="api_secret" type="password" autocomplete="current-password" required />

        <button id="submit-btn" type="submit">Run Audit</button>
      </form>

      <div id="status" class="status" aria-live="polite"></div>
      <div id="error" class="status error" aria-live="polite"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
